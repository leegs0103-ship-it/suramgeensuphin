<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수람쥐와 수핀의 넓은 바다 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed pastel 3D sea with a chase camera behind the riders; soft rounded HUD cards in the corners, round arrow pads at the bottom. One pastel look by design. */
:root{
  --navy:#4a2c1a;
  --navy-soft:#7a5038;
  --mint:#f3e3c8;
  --cream:#fffaf0;
  --coral:#d9813b;
  --coral-deep:#a95f26;
  --sun:#f2c14e;
  --sea:#7fcdd2;
  --f-kr:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Fredoka','Jua',sans-serif;
  --lift:0 5px 0 rgba(74,44,26,.18),0 10px 24px rgba(74,44,26,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mint);color:var(--navy);overflow:hidden;font-family:var(--f-kr);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--f-kr);color:var(--navy)}
button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,transparent 45%,rgba(240,126,116,.55))}
#flash.on{opacity:1;transition:none}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.plates{display:flex;gap:8px;flex-wrap:wrap}
.plate{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:16px;box-shadow:var(--lift);padding:5px 14px 5px 6px}
.plate .lbl{background:var(--navy);color:#fff;border-radius:10px;padding:3px 9px 4px;font-size:13px;letter-spacing:.18em}
.plate b{font-family:var(--f-num);font-weight:700;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums;line-height:1}
.plate small{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--navy-soft)}
.plate svg{width:28px;height:28px;flex:none;margin-left:4px}
.plate.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12)}}
.hearts{display:flex;gap:4px;background:var(--cream);border-radius:14px;padding:5px 8px;box-shadow:var(--lift)}
.hearts svg{width:24px;height:24px}
.hearts svg.lost path{fill:#e6d8c6}
.shieldbar{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--cream);border-radius:14px;padding:5px 10px;box-shadow:var(--lift)}
.shieldbar .track{width:96px;height:10px;border-radius:6px;background:#f0e2cf;overflow:hidden}
.shieldbar .fill{display:block;height:100%;background:var(--sun);width:100%}
.hud-right{display:flex;gap:8px;pointer-events:auto}
.ibtn{min-width:46px;height:46px;padding:0 12px;display:grid;place-items:center;border:0;border-radius:16px;background:var(--cream);box-shadow:var(--lift);cursor:pointer;font-size:15px}
.ibtn:active{transform:translateY(3px)}
.ibtn svg{width:22px;height:22px}
.ibtn.muted{opacity:.55}

#pops{position:absolute;left:0;right:0;top:24%;height:0;pointer-events:none}
.pop{position:absolute;left:50%;top:0;max-width:90vw;width:max-content;text-align:center;font-size:clamp(20px,4.8vw,34px);line-height:1.2;background:var(--cream);border-radius:20px;padding:8px 18px 10px;box-shadow:var(--lift);animation:pop 1.3s ease-out forwards;text-wrap:balance}
.pop.bad{background:var(--coral);color:#fff}
.pop.good{background:#9fe0b8}
.pop.cool{background:var(--sun)}
@keyframes pop{0%{transform:translate(-50%,20px) scale(.4) rotate(var(--r));opacity:0}14%{transform:translate(-50%,0) scale(1.08) rotate(var(--r));opacity:1}26%{transform:translate(-50%,0) scale(1) rotate(var(--r))}80%{opacity:1}100%{transform:translate(-50%,-50px) rotate(var(--r));opacity:0}}
#banner{position:absolute;left:0;right:0;top:13%;display:flex;justify-content:center;pointer-events:none;opacity:0}
#banner.on{animation:banner 2.3s ease-in-out}
#banner div{background:var(--navy);color:#fff;border-radius:18px;padding:8px 26px 10px;text-align:center;box-shadow:var(--lift)}
#banner b{display:block;font-family:var(--f-num);font-weight:700;font-size:clamp(28px,6vw,42px);color:var(--sun)}
#banner span{font-size:clamp(15px,3.6vw,20px)}
@keyframes banner{0%{opacity:0;transform:translateY(-20px) scale(.9)}14%{opacity:1;transform:none}84%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}

/* pads */
#pads{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.padgroup{display:flex;gap:12px;pointer-events:auto;align-items:flex-end}
.padgroup.v{flex-direction:column;align-items:center}
.pad{width:clamp(60px,15vw,76px);height:clamp(60px,15vw,76px);padding:0;border:0;border-radius:50%;background:var(--cream);box-shadow:0 6px 0 rgba(74,44,26,.22),0 10px 22px rgba(74,44,26,.14);
  display:grid;place-items:center;touch-action:none;cursor:pointer;position:relative;transition:transform .06s,background .1s}
.pad.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(74,44,26,.22);background:var(--sun)}
.pad svg{width:48%;height:48%}
.pad em{position:absolute;bottom:-4px;left:50%;transform:translate(-50%,100%);font-style:normal;font-size:12px;color:var(--navy);background:rgba(255,250,241,.85);border-radius:8px;padding:0 6px;white-space:nowrap}
.padgroup.v .pad em{display:none}
.pad.jump{background:var(--coral);width:clamp(68px,17vw,86px);height:clamp(68px,17vw,86px)}
.pad.jump svg path{stroke:#fff}
.pad.jump.on{background:var(--sun)}
.pad .tag-in{position:absolute;bottom:9px;font-size:12px;color:#fff;letter-spacing:.05em}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.btn{font-size:clamp(22px,4.8vw,28px);padding:10px 34px 13px;border:0;border-radius:20px;background:var(--coral);color:#fff;
  box-shadow:0 7px 0 var(--coral-deep),0 14px 26px rgba(74,44,26,.18);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--coral-deep)}
.btn.alt{background:var(--cream);color:var(--navy);box-shadow:0 7px 0 #e2cfb4,0 14px 26px rgba(74,44,26,.14)}
.btn.big{font-size:clamp(32px,7.5vw,44px);padding:10px 64px 14px;border-radius:26px}

#title{justify-content:space-between}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo-label{background:var(--navy);color:#fff;padding:8px 22px 9px;font-size:clamp(17px,min(4.2vw,3.8vh),26px);letter-spacing:.32em;text-indent:.32em;border-radius:4px}
.logo-main{font-size:clamp(46px,min(12.5vw,11vh),108px);line-height:1;color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 9px 0 rgba(74,44,26,.35)}
.logo-main .accent{color:var(--sun)}
.ch{display:inline-block;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both,float 3s ease-in-out infinite;animation-delay:calc(var(--i) * 60ms),calc(var(--i) * 140ms + .9s)}
@keyframes drop{0%{transform:translateY(-90px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.tag{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.tag b{font-weight:400;font-size:clamp(18px,4.2vw,24px);background:var(--cream);border-radius:12px;padding:2px 12px 4px;box-shadow:var(--lift)}
.tag em{font-style:normal;font-size:13px;margin-top:4px;background:var(--navy);color:#fff;border-radius:8px;padding:1px 8px 2px}
.title-bottom{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.title-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;width:100%;max-width:760px}
.card{background:var(--cream);border-radius:20px;box-shadow:var(--lift);padding:12px 16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;align-items:center;font-size:clamp(14px,3.4vw,16px);min-width:0}
.keys .k{display:flex;gap:4px}
kbd{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;background:#fff;border-radius:8px;box-shadow:0 3px 0 #e2cfb4,inset 0 0 0 2px #f0e2cf;font-family:var(--f-num);font-weight:700;font-size:14px;line-height:1}
.keys small{color:#9a7a62;font-size:.86em}
.bestbox{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:130px}
.bestbox span{font-size:13px;letter-spacing:.14em;color:#9a7a62}
.bestbox b{font-family:var(--f-num);font-weight:700;font-size:34px}
.tip{font-size:clamp(14px,3.4vw,16px);text-align:center;max-width:60ch;text-wrap:balance;background:rgba(255,250,241,.8);border-radius:12px;padding:4px 12px}

#count{justify-content:center;pointer-events:none}
#count b{font-family:var(--f-num);font-weight:700;font-size:clamp(100px,26vw,170px);color:#fff;text-shadow:0 6px 0 var(--navy),0 14px 30px rgba(74,44,26,.3);animation:cnt .9s ease-out both}
#count b.go{font-family:var(--f-kr);font-weight:400;font-size:clamp(76px,20vw,130px);color:var(--sun)}
@keyframes cnt{0%{transform:scale(2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}

#pause{justify-content:center;gap:16px;background:rgba(197,232,218,.7)}
#pause h2{margin:0;font-weight:400;font-size:clamp(48px,12vw,80px);color:#fff;text-shadow:0 4px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy)}
#pause p{margin:0;font-size:18px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

#over{justify-content:center;gap:14px;background:rgba(197,232,218,.62)}
#over h2{margin:0;font-weight:400;font-size:clamp(56px,min(14vw,10vh),96px);color:#fff;transform:rotate(-4deg);animation:slam .5s cubic-bezier(.3,1.6,.5,1) both;
  text-shadow:0 4px 0 var(--navy),4px 0 0 var(--navy),-4px 0 0 var(--navy),0 -4px 0 var(--navy),3px 3px 0 var(--navy),-3px 3px 0 var(--navy),3px -3px 0 var(--navy),-3px -3px 0 var(--navy),0 12px 0 rgba(74,44,26,.3)}
@keyframes slam{0%{transform:scale(2.4) rotate(-4deg);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
.caption{font-size:clamp(17px,4vw,22px);text-align:center;max-width:26ch;text-wrap:balance;background:var(--navy);color:#fff;border-radius:16px;padding:8px 18px 10px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 28px;align-items:baseline;position:relative;min-width:min(300px,100%)}
.stats span{font-size:16px;color:#9a7a62}
.stats b{font-family:var(--f-num);font-weight:700;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.stats .total{font-size:19px;color:var(--navy);padding-top:6px;border-top:2px dashed #ecdcc6}
.stats b.total{font-size:36px;color:var(--coral)}
.newrec{position:absolute;top:-14px;right:-12px;background:var(--sun);border-radius:10px;padding:2px 10px 4px;font-size:15px;transform:rotate(8deg);box-shadow:var(--lift)}

#live{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,env(safe-area-inset-right,0px));width:clamp(136px,31vw,250px);aspect-ratio:4/3;
  border:4px solid var(--cream);border-radius:18px;box-shadow:var(--lift);pointer-events:none}
@media (min-width:760px){ #live{top:calc(env(safe-area-inset-top,0px) + 12px);right:auto;left:50%;transform:translateX(-50%)} }
.live-badge{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:5px;background:var(--coral);color:#fff;font-family:var(--f-num);font-weight:700;font-size:11px;letter-spacing:.12em;border-radius:8px;padding:2px 7px 2px 6px}
.live-badge i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.live-name{position:absolute;right:6px;top:6px;font-size:11px;background:rgba(74,44,26,.78);color:#fff;border-radius:8px;padding:2px 7px}
.live-say{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;font-size:clamp(13px,3vw,16px);background:var(--cream);border-radius:12px;padding:2px 12px 4px;box-shadow:var(--lift)}
@media (max-height:640px){ .keys{display:none} }
@media (prefers-reduced-motion:reduce){ .ch{animation:none} }
</style>

<div id="app">
  <canvas id="game" aria-label="바다 게임 화면"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <div id="hud" hidden>
    <div class="hud-left">
      <div class="plates">
        <div class="plate"><span class="lbl">거리</span><b id="dist">0</b><small>m</small></div>

          <b id="nuts">0</b>

      <button class="ibtn" id="btnPause" aria-label="일시정지"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.6" fill="#4a2c1a"/><rect x="14" y="5" width="4" height="14" rx="1.6" fill="#4a2c1a"/></svg></button>
    </div>
  </div>

  <div id="live" hidden aria-label="수람쥐와 수핀 얼굴 중계 화면"><div class="live-badge"><i></i>LIVE</div><div class="live-name">얼굴캠</div><div class="live-say" id="liveSay">룰루랄라~</div></div>

      <button class="pad" data-a="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 4.5l7.5 7.5L9 19.5" fill="none" stroke="#4a2c1a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg><em>오른쪽</em></button>
    </div>
    <div class="padgroup v">
      <button class="pad jump" data-a="up" aria-label="점프"><svg viewBox="0 0 24 24" style="margin-bottom:12px"><path d="M5 15l7-7 7 7" fill="none" stroke="#4a2c1a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tag-in">점프</span></button>
      <button class="pad" data-a="down" aria-label="잠수"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="#4a2c1a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="logo" aria-label="수람쥐와 수핀의 넓은 바다 대모험">

      <div class="logo-main" data-split="넓은 바다|대모험!"></div>
    </div>
    <div class="tag" id="tagSq"><b>수람쥐</b><em>도토리 수집가</em></div>
    <div class="tag" id="tagDp"><b>수핀</b><em>바다 택시</em></div>
    <div class="title-bottom">
      <button class="btn big" id="btnStart">출발!</button>
      <div class="title-row">
        <div class="card keys">
          <span class="k"><kbd>←</kbd><kbd>→</kbd></span><span>옆 레인으로 스르륵</span>
          <span class="k"><kbd>↑</kbd></span><span>점프 <small>튜브 · 상자 · 상어 · 파도를 넘어요</small></span>
          <span class="k"><kbd>↓</kbd></span><span>잠수 <small>갈매기 · 문어 다리 밑으로</small></span>
          <span class="k"><kbd>C</kbd></span><span>카메라 거리 <small>가까이 ↔ 멀리</small></span>

  <div id="count" class="screen" hidden></div>

  </div>

      <button class="btn" id="btnRetry">다시 출발!</button>

  </div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- soft rounded "blob" geometry (superellipsoid) ---------- */
const geoCache = {};
function blobGeo(e){
  const k = 'b' + e; if (geoCache[k]) return geoCache[k];
  const g = new THREE.SphereGeometry(1, 26, 18);
  const p = g.attributes.position, n = g.attributes.normal; const q = 2 / e - 1;
  const f = c => Math.sign(c) * Math.pow(Math.abs(c), e);
  const h = c => Math.sign(c) * Math.pow(Math.abs(c), q);
  for (let i = 0; i < p.count; i++){
    const X = f(p.getX(i)), Y = f(p.getY(i)), Z = f(p.getZ(i)); p.setXYZ(i, X, Y, Z);
    const nx = h(X), ny = h(Y), nz = h(Z); const l = Math.hypot(nx, ny, nz) || 1; n.setXYZ(i, nx / l, ny / l, nz / l);
  }
  return (geoCache[k] = g);
}
const matCache = {};

const roundE = e => Math.min(0.96, 0.56 + e * 0.5);

const flat = c => flatCache[c] || (flatCache[c] = new THREE.MeshBasicMaterial({ color: c }));

  const m = new THREE.Mesh(blobGeo(roundE(e)), typeof color === 'number' ? mat(color) : color);
  m.position.set(p[0], p[1], p[2]);
  if (typeof s === 'number') m.scale.setScalar(s); else m.scale.set(s[0], s[1], s[2]);
  if (r) m.rotation.set(r[0], r[1], r[2]);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function M(parent, geo, color, p, s, r){
  const m = new THREE.Mesh(geo, typeof color === 'number' ? mat(color) : color);
  m.position.set(p[0], p[1], p[2]);
  if (s != null){ if (typeof s === 'number') m.scale.setScalar(s); else m.scale.set(s[0], s[1], s[2]); }
  if (r) m.rotation.set(r[0], r[1], r[2]);
  m.castShadow = true; parent.add(m); return m;
}
const discGeo = new THREE.CylinderGeometry(1, 1, 0.14, 22); discGeo.rotateX(Math.PI / 2);

/* mouths: a soft "w" smile and a surprised "o" */
const fullDisc = new THREE.CircleGeometry(1, 24);

function setMood(ud, mood, t){

  ud.faceEyes.forEach(e => { const happy = mood === 'joy'; e.userData.open.forEach(m => m.visible = !happy); e.userData.arc.visible = happy; e.scale.y = blink ? 0.15 : 1; });
  ud.mouth.grin.visible = mood !== 'ouch'; ud.mouth.ooh.visible = mood === 'ouch';
  const big = mood === 'joy' ? 1.25 : 1; ud.mouth.grin.scale.set(big, big, 1);

/* one smooth tapered tube (tail) */
function taperTube(pts, c0, c1, r0 = 0.1, r1 = 0.19, segs = 56, radial = 20){
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const fr = curve.computeFrenetFrames(segs, false);
  const pos = [], col = [], idx = []; const A = new THREE.Color(c0), Bc = new THREE.Color(c1), tc = new THREE.Color();
  const rr = t => r0 + r1 * Math.sin(Math.PI * t * 0.95);
  const rad = t => t < 0.86 ? rr(t) : rr(0.86) * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.86) / 0.14, 2)));
  for (let i = 0; i <= segs; i++){
    const t = i / segs, c = curve.getPointAt(t), r = rad(t), N = fr.normals[i], Bn = fr.binormals[i];
    tc.copy(A).lerp(Bc, THREE.MathUtils.smoothstep(t, 0.8, 0.95));
    for (let j = 0; j <= radial; j++){ const a = j / radial * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      pos.push(c.x + (N.x * ca + Bn.x * sa) * r, c.y + (N.y * ca + Bn.y * sa) * r, c.z + (N.z * ca + Bn.z * sa) * r); col.push(tc.r, tc.g, tc.b); }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++){ const a = i * (radial + 1) + j, b = a + radial + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* rounded teardrop (ears) */
const earGeo = (() => { const g = new THREE.SphereGeometry(1, 24, 18); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){ const y = p.getY(i), k = 1 - 0.72 * Math.pow((y + 1) / 2, 1.6); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); }
  g.computeVertexNormals(); return g; })();
const glossCache = {};
const gloss = c => glossCache[c] || (glossCache[c] = new THREE.MeshPhongMaterial({ color: c, shininess: 38, specular: 0x2a2420 }));
function E(parent, color, p, s, r){ const m = new THREE.Mesh(earGeo, gloss(color)); m.position.set(p[0], p[1], p[2]); m.scale.set(s[0], s[1], s[2]); if (r) m.rotation.set(r[0], r[1], r[2]); m.castShadow = true; parent.add(m); return m; }

/* high-res head whose vertex colours carry the painted stripes */
function stripedHeadGeo(c0, c1){
  const e = 0.96, q = 2 / e - 1, g = new THREE.SphereGeometry(1, 128, 96);
  const p = g.attributes.position, n = g.attributes.normal, col = [];
  const f = c => Math.sign(c) * Math.pow(Math.abs(c), e), h = c => Math.sign(c) * Math.pow(Math.abs(c), q);
  const A = new THREE.Color(c0), Bc = new THREE.Color(c1), tc = new THREE.Color();
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < p.count; i++){
    const X = f(p.getX(i)), Y = f(p.getY(i)), Z = f(p.getZ(i)); p.setXYZ(i, X, Y, Z);
    const nx = h(X), ny = h(Y), nz = h(Z); const l = Math.hypot(nx, ny, nz) || 1; n.setXYZ(i, nx / l, ny / l, nz / l);
    const wx = X * 0.54, wy = Y * 0.48, wz = Z * 0.48, th = Math.atan2(-wz, wy);
    let k = 0;
    for (const [x0, w] of [[-0.1, 0.022], [0, 0.027], [0.1, 0.022]]) k = Math.max(k, 1 - ss(w * 0.7, w, Math.abs(wx - x0)));
    k *= ss(-1.45, -1.3, th) * (1 - ss(0.92, 1.05, th));
    tc.copy(A).lerp(Bc, k); col.push(tc.r, tc.g, tc.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return g;
}

/* ---------- spawning ---------- */
function tagsOf(mesh){ const t = {}; mesh.traverse(c => { if (c.userData.tag) (t[c.userData.tag] = t[c.userData.tag] || []).push(c); }); return t; }
function addObstacle(kind, L, z){
  const def = KINDS[kind]; const mesh = TPL[kind].clone(); const x = def.wide ? 0 : LANES[L];
  mesh.position.set(x, def.y, z); if (def.wide) mesh.scale.set(1, 0.85, 0.85); else mesh.scale.setScalar(0.85); scene.add(mesh);
  obs.push({ mesh, kind, zone: def.zone, wide: !!def.wide, fly: !!def.fly, x, x0: x, z, y: def.y, depth: def.depth, tags: tagsOf(mesh), seed: Math.random() * 10, dead: false, near: false });
}
function addItem(L, z, y = 1.0, gold = false){
  const mesh = (gold ? GOLD : ACORN).clone(); const x = LANES[L]; mesh.position.set(x, y, z); scene.add(mesh);
  items.push({ mesh, x, z, y, gold, tags: tagsOf(mesh), seed: Math.random() * 6 });
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickFrom = pool => { let tot = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * tot; for (const [k, w] of pool){ if ((r -= w) <= 0) return k; } return pool[0][0]; };
function kindPool(zone){
  if (zone === 'low') return dist > 150 ? [['ring', 3], ['crate', 3], ['shark', 2.5]] : [['ring', 3], ['crate', 3]];
  if (zone === 'high') return [['gull', 3], ['octo', 2]];
  return [['duck', 3], ['buoy', 2.5], ['whale', dist > 200 ? 2 : 0.01]];
}
let lastWave = -999;
function spawnRow(){
  const z = -175; const d = Math.min(1, dist / 3000);
  if (dist > 380 && dist - lastWave > 300 && Math.random() < 0.16 + d * 0.08){
    lastWave = dist; addObstacle('wave', 1, z);
    for (let i = -1; i <= 1; i++) addItem(1, z + i * 1.6, 2.9);
    return;
  }
  const lanes = shuffle([0, 1, 2]);
  const highOK = dist > 260;
  const zoneFor = () => { const r = Math.random(); if (highOK && r < 0.22) return 'high'; return r < 0.62 ? 'low' : 'full'; };
  // fewer rows, but each row asks more of you: often 2 lanes, sometimes all 3 with a jump/dive gap
  let n = Math.random() < 0.42 + d * 0.38 ? 2 : 1;
  if (dist > 600 && Math.random() < 0.12 + d * 0.18) n = 3;
  const zones = [];
  for (let i = 0; i < n; i++) zones.push(zoneFor());
  if (n === 3 && zones.every(zn => zn === 'full')) zones[0] = 'low';
  if (n === 3 && !zones.includes('low') && !zones.includes('high')) zones[0] = 'low';
  if (n === 3){ const passable = zones.findIndex(zn => zn !== 'full'); if (passable < 0) zones[0] = 'low'; }
  for (let i = 0; i < n; i++){
    const L = lanes[i]; const k = pickFrom(kindPool(zones[i])); addObstacle(k, L, z);
    if (zones[i] === 'low' && Math.random() < 0.4) for (let j = -1; j <= 1; j++) addItem(L, z + j * 1.6, 2.9);
  }
  if (n < 3){
    const free = lanes[n];
    if (Math.random() < 0.7){ const cnt = 4 + Math.floor(Math.random() * 3); for (let i = 0; i < cnt; i++) addItem(free, z + 14 - i * 3.2, 1.0); }
    if (Math.random() < 0.07 && dist > 120) addItem(free, z - 5, 1.2, true);
  }
}
function spawnScenery(zPos = -200){
  const side = Math.random() < 0.5 ? -1 : 1; const g = SCN[Math.floor(Math.random() * SCN.length)]();
  g.position.set(side * (17 + Math.random() * 24), 0, zPos); g.rotation.y = Math.random() * Math.PI * 2; g.scale.setScalar(0.9 + Math.random() * 0.5);
  g.traverse(c => { if (c.isMesh){ c.castShadow = false; c.receiveShadow = false; } });
  scene.add(g); scenery.push(g);
}
for (let i = 0; i < 10; i++) spawnScenery(-200 + i * 22);
function clearWorld(){ for (const o of obs) scene.remove(o.mesh); for (const it of items) scene.remove(it.mesh); obs = []; items = []; }

/* ---------- actions ---------- */
function move(dir){
  if (state !== 'play') return;
  const n = Math.max(0, Math.min(2, lane + dir));
  if (n === lane){ sfx.wall(); shake = Math.max(shake, 0.08); return; }
  lane = n; sfx.lane();
}
function jump(){
  if (state !== 'play' || airborne) return;
  const fromDeep = diveY < -1.2;
  diveT = 0; diveQueued = false; airborne = true; vy = fromDeep ? 14 : 12.5; jumpY = Math.max(jumpY, 0.01);
  sfx.jump(); burst(px, 0.3, 0.6, 12, 0xffffff, 5, 0.2);
  if (fromDeep) pop('돌고래 점프!', 'cool');
}
function dive(){
  if (state !== 'play') return;
  if (airborne){ vy = Math.min(vy, -22); diveQueued = true; return; }
  if (diveT <= 0){ sfx.dive(); burst(px, 0.3, -1.2, 14, 0xffffff, 5, 0.2); }
  diveT = 0.85;
}
const ACTIONS = { left: () => move(-1), right: () => move(1), up: jump, down: dive };

function launch(o){ o.dead = true; o.vel = new THREE.Vector3(((o.x - px) || (Math.random() - 0.5)) * 2.5 + (Math.random() - 0.5) * 5, 13 + Math.random() * 4, -6); o.spin = new THREE.Vector3(Math.random() * 6 - 3, Math.random() * 6 - 3, Math.random() * 6 - 3); }
function hitObstacle(o){
  if (invuln > 0) return;
  launch(o);
  if (shieldT > 0){ shieldT = 0; invuln = 0.6; pop('도토리 방패로 막음!', 'cool'); sfx.shield(); burst(px, 1.4, -1, 18, 0xf7c94b, 8, 0.18); return; }
  lives--; invuln = 1.6; lastHit = o.kind; shake = reduceMotion ? 0.12 : 0.45; flash(); sfx.hit(); drawHearts();
  burst(o.mesh.position.x, 1.2, -0.5, 14, 0xffffff, 9, 0.2);
  if (lives <= 0){ gameOver(); return; }
  pop(HIT[o.kind], 'bad');
}

const show = (id, on) => { $(id).hidden = !on; };
function resetRun(){
  clearWorld(); lane = 1; px = 0; pxVel = 0; jumpY = 0; vy = 0; airborne = false; diveT = 0; diveY = 0; diveQueued = false; bank = yaw = sqLean = sqLeanV = 0;
  speed = 26; dist = 0; nuts = 0; nearBonus = 0; lives = 3; invuln = 0; shieldT = 0; nextRow = 45; lastMile = 0; lastWave = -999;
  hudDist = hudNuts = -1; drawHearts(); squirrel.position.set(0, 0.8, -0.3); squirrel.rotation.set(0, 0, 0); body.rotation.set(0, 0, 0);
}
let countTimer = null;

  initAudio(); resetRun();
  show('#title', false); show('#over', false); show('#pause', false); show('#hud', true); show('#pads', true); show('#live', true);
  state = 'countdown'; const c = $('#count'); show('#count', true);

/* ---------- input ---------- */
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') ACTIONS.left();
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') ACTIONS.right();
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') ACTIONS.up();
  else if (k === 'ArrowDown' || k === 's' || k === 'S') ACTIONS.down();
  else if (k === 'c' || k === 'C' || k === 'ㅊ') setCam(camMode === 'near' ? 'far' : 'near');
  else if (k === 'p' || k === 'P' || k === 'Escape') state === 'paused' ? resume() : pause();
  else if (k === 'Enter' && (state === 'title' || (state === 'over' && !$('#over').hidden))) startGame();
  const pad = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if (pad && state === 'play'){ const b = document.querySelector(`.pad[data-a="${pad}"]`); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 120); }
});
document.querySelectorAll('.pad').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); ACTIONS[b.dataset.a](); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => b.classList.remove('on')));
});
let sw = null;
canvas.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
  if (Math.abs(dx) > Math.abs(dy)) ACTIONS[dx < 0 ? 'left' : 'right'](); else ACTIONS[dy < 0 ? 'up' : 'down']();
});

/* ---------- motion helpers ---------- */
function smoothDamp(cur, target, vel, st, dt){
  const o = 2 / st, x = o * dt, e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = cur - target, tmp = (vel + o * ch) * dt;
  const nv = (vel - o * tmp) * e; return [target + (ch + tmp) * e, nv];
}
const camPos = new THREE.Vector3(0, 2.4, -6.5), camLook = new THREE.Vector3(0, 1.3, 0), tv = new THREE.Vector3(), tl = new THREE.Vector3();
const PAL = {
  day:    { top: new THREE.Color(0x9fcfe0), bot: new THREE.Color(0xf8e6cc), sea: new THREE.Color(0x6fbfcb) },
  sunset: { top: new THREE.Color(0xd7a98a), bot: new THREE.Color(0xf6d2b0), sea: new THREE.Color(0x7aa9c4) }
};

/* ---------- main loop ---------- */
let last = performance.now();
function loop(nowMs){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  if (state === 'paused'){ renderer.render(scene, camera); renderLive(); return; }
  T += dt;
  const ws = state === 'play' ? speed : state === 'over' ? Math.max(0, speed * (1 - overT * 1.5)) : state === 'countdown' ? 10 : 12;
  scroll += ws * dt;

  if (state === 'play'){
    dist += speed * dt; speed = 26 + Math.min(30, dist * 0.009);
    if (dist >= nextRow){ spawnRow(); const gapT = Math.max(1.0, 1.6 - dist * 0.0002); nextRow = dist + speed * gapT; }
    invuln = Math.max(0, invuln - dt); shieldT = Math.max(0, shieldT - dt);
    const mile = Math.floor(dist / 500); if (mile > lastMile){ lastMile = mile; banner(mile * 500 + 'm', MILES[(mile - 1) % MILES.length]); }
  }
  if (state === 'over') overT += dt;
  nextScn -= ws * dt; if (nextScn <= 0){ spawnScenery(); nextScn = 14 + Math.random() * 16; }

  /* smooth lane glide (critically damped) + banking */
  [px, pxVel] = smoothDamp(px, LANES[lane], pxVel, 0.14, dt);
  if (airborne){
    vy -= 30 * dt; jumpY += vy * dt;
    if (jumpY <= 0){ jumpY = 0; airborne = false; vy = 0; sfx.land(); burst(px, 0.3, 0, 14, 0xffffff, 6, 0.2); if (diveQueued){ diveQueued = false; dive(); } }
  }
  if (diveT > 0) diveT -= dt;
  diveY += ((diveT > 0 ? -2.7 : 0) - diveY) * Math.min(1, dt * 8);
  const bob = waveH(px, 0) * 0.5;
  const py = jumpY + diveY + bob;
  player.position.set(px, py, 0);
  const k = Math.min(1, dt * 9);
  bank += (THREE.MathUtils.clamp(-pxVel * 0.05, -0.45, 0.45) - bank) * k;
  yaw += (THREE.MathUtils.clamp(-pxVel * 0.035, -0.32, 0.32) - yaw) * k;
  body.rotation.z = bank + Math.sin(T * 1.7) * 0.025;
  body.rotation.y = yaw;
  body.rotation.x = airborne ? THREE.MathUtils.clamp(-vy * 0.022, -0.32, 0.32) : (diveT > 0 ? 0.22 : Math.sin(T * 2.2) * 0.03);
  // squirrel: springy secondary lean so it sways after the dolphin turns
  const leanTarget = bank * 1.3;
  sqLeanV += ((leanTarget - sqLean) * 60 - sqLeanV * 9) * dt; sqLean += sqLeanV * dt;
  if (state === 'over'){
    body.rotation.z = bank + overT * 2.4;
    squirrel.position.y = 0.8 + Math.max(0, 6 * overT - 9 * overT * overT) * 1.4; squirrel.rotation.x = -overT * 6;
  } else squirrel.rotation.z = sqLean;
  const du = dolphin.userData; du.tail.rotation.x = Math.sin(T * (state === 'play' ? 10 : 5)) * 0.26; du.flip.forEach((f, i) => f.rotation.x = Math.sin(T * 4 + i) * 0.22);
  const su = squirrel.userData;
  su.tail.rotation.z = Math.sin(T * 2.6) * 0.1 - sqLeanV * 0.06; su.tail.rotation.x = Math.sin(T * 3.4) * 0.06 + (airborne ? -0.25 : 0);
  su.scarf.rotation.y = Math.sin(T * 16) * 0.35; su.scarf.rotation.x = 0.15 + Math.sin(T * 11) * 0.18;
  const cheer = (airborne && state === 'play') || (state === 'title' && Math.sin(T * 1.6) > 0.55);
  const armT = cheer ? 2.85 + Math.sin(T * 18) * 0.12 : 1.15;
  su.armL.rotation.x += (armT - su.armL.rotation.x) * Math.min(1, dt * 12);
  su.armR.rotation.x += ((state === 'title' ? 1.15 : armT) - su.armR.rotation.x) * Math.min(1, dt * 12);
  su.head.rotation.y = state === 'title' ? Math.sin(T * 0.9) * 0.35 : -pxVel * 0.05;
  su.head.rotation.z = -sqLean * 0.4;
  joyT = Math.max(0, joyT - dt);
  let mood = 'happy', say = '룰루랄라~';
  if (state === 'over'){ mood = 'ouch'; say = '으아아악!'; }
  else if (state === 'play' && invuln > 0.7){ mood = 'ouch'; say = '아야야!'; }
  else if (airborne){ mood = 'joy'; say = '와아아아!'; }
  else if (diveT > 0){ mood = 'joy'; say = '꼬르륵~'; }
  else if (joyT > 0){ mood = 'joy'; say = joySay; }
  else if (state === 'title' && Math.sin(T * 1.6) > 0.55) mood = 'joy';
  else if (shieldT > 0) say = '방패 있다 든든!';
  else if (state === 'play' && speed > 42) say = '엄청 빨라!!';
  setMood(su, mood, T); setMood(du, mood, T + 1.3);
  if (say !== liveSayTxt){ liveSayTxt = say; $('#liveSay').textContent = say; }
  body.visible = invuln > 0 ? Math.floor(T * 14) % 2 === 0 : true;
  shield.visible = shieldT > 0 && (shieldT > 1.5 || Math.floor(T * 10) % 2 === 0);
  shield.scale.setScalar(1 + Math.sin(T * 5) * 0.03);
  // wake behind the dolphin
  if (state === 'play' && !airborne && diveY > -0.5){ wakeT -= dt; if (wakeT <= 0){ wakeT = 0.05; burst(px + (Math.random() - 0.5) * 0.6, 0.12, 1.9, 2, 0xffffff, 2, 0.13, 6, 1.4); } }

  /* obstacles */
  const deep = diveY < -1.5, high = jumpY > 0.8;
  for (let i = obs.length - 1; i >= 0; i--){
    const o = obs[i];
    if (o.dead){
      o.vel.y -= 24 * dt; o.mesh.position.addScaledVector(o.vel, dt); o.mesh.position.z += ws * dt;
      o.mesh.rotation.x += o.spin.x * dt; o.mesh.rotation.y += o.spin.y * dt; o.mesh.rotation.z += o.spin.z * dt;
      if (o.mesh.position.y < -15 || o.mesh.position.z > 30){ scene.remove(o.mesh); obs.splice(i, 1); }
      continue;
    }
    o.z += ws * dt;
    if (o.kind === 'shark') o.x = o.x0 + Math.sin(T * 1.5 + o.seed) * 0.5;
    const fy = o.fly ? o.y + Math.sin(T * 3 + o.seed) * 0.15 : o.y + waveH(o.x, o.z) * 0.7;
    o.mesh.position.set(o.x, fy, o.z);
    if (o.kind === 'duck') o.mesh.rotation.y = Math.sin(T * 1.4 + o.seed) * 0.22;
    if (o.kind === 'ring') o.mesh.rotation.y = T * 0.7 + o.seed;
    if (o.kind === 'crate' || o.kind === 'buoy') o.mesh.rotation.z = Math.sin(T * 1.8 + o.seed) * 0.08;
    if (o.kind === 'whale') o.mesh.rotation.x = Math.sin(T * 2 + o.seed) * 0.12;
    if (o.tags.wing) o.tags.wing.forEach(w => w.rotation.z = w.userData.side * Math.sin(T * 13 + o.seed) * 0.65);
    if (o.tags.lamp) o.tags.lamp.forEach(l => l.scale.setScalar(Math.floor(T * 2.5 + o.seed) % 2 ? 0.28 : 0.2));
    if (o.tags.tent) o.tags.tent.forEach(t => t.rotation.z = Math.sin(T * 2.4 + o.seed) * 0.06);
    if (o.tags.crab) o.tags.crab.forEach(c => c.rotation.y = Math.sin(T * 4) * 0.4);
    if (o.tags.foam) o.tags.foam.forEach(f => f.position.y = 0.82 + Math.sin(T * 6 + f.userData.i) * 0.1);
    if (state === 'play' && Math.abs(o.z) < o.depth){
      if (o.wide || Math.abs(o.x - px) < 1.55){
        const avoided = (o.zone === 'low' && high) || (o.zone === 'high' && deep);
        if (!avoided) hitObstacle(o);
        else if (!o.near){ o.near = true; nearBonus += 25; joyT = 0.6; joySay = '아슬아슬~'; sfx.near(); pop(o.zone === 'low' ? '휙! 넘었다 +25' : '쏙! 밑으로 통과 +25', 'good'); }
      }
    }
    if (o.z > 20){ scene.remove(o.mesh); obs.splice(i, 1); }
  }
  /* acorns */
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i]; it.z += ws * dt;
    it.mesh.position.set(it.x, it.y + Math.sin(T * 4 + it.seed) * 0.12 + (it.y < 2 ? waveH(it.x, it.z) * 0.4 : 0), it.z);
    it.mesh.rotation.y = T * 2.6 + it.seed;
    if (it.tags.halo) it.tags.halo.forEach(h => { h.rotation.x = T * 3; h.rotation.y = T * 2; });
    if (state === 'play' && Math.abs(it.z) < 1.4 && Math.abs(it.x - px) < 1.5 && it.y > py - 0.8 && it.y < py + 2.3){
      scene.remove(it.mesh); items.splice(i, 1);
      if (it.gold){ shieldT = 7; sfx.gold(); pop('황금 도토리! 방패 장착', 'cool'); burst(it.x, it.y, 0, 18, 0xf5c94a, 8, 0.16); }
      else { nuts++; joyT = 0.45; joySay = '도토리 냠!'; sfx.coin(); bump('#nutPlate'); burst(it.x, it.y, 0, 6, 0xf5c94a, 4, 0.12); if (nuts % 25 === 0) pop('도토리 ' + nuts + '개! 볼 빵빵'); }
      continue;
    }
    if (it.z > 20){ scene.remove(it.mesh); items.splice(i, 1); }
  }
  for (let i = scenery.length - 1; i >= 0; i--){ const s = scenery[i]; s.position.z += ws * dt; s.position.y = waveH(s.position.x, s.position.z) * 0.25; if (s.position.z > 40){ scene.remove(s); scenery.splice(i, 1); } }
  for (const f of foams){ f.position.z += ws * dt; if (f.position.z > 15){ f.position.z -= 175; f.position.x = (Math.random() - 0.5) * 36; } f.position.y = waveH(f.position.x, f.position.z) + 0.04; }
  const sp = state === 'play' ? THREE.MathUtils.clamp((speed - 20) / 30, 0.15, 1) : 0;
  streakMat.opacity += (sp * 0.55 - streakMat.opacity) * Math.min(1, dt * 3);
  for (const st of streaks){ st.position.z += ws * dt * 1.7; st.scale.z = 1 + ws * 0.06; if (st.position.z > 8) placeStreak(st, -60 - Math.random() * 20); }
  updateParts(dt, ws);
  updateNotes(dt);
  updateWater();

  /* sky drifts from day to a soft sunset and back */
  const kk = (1 - Math.cos(scroll / 2800 * Math.PI * 2)) / 2 * 0.85;
  skyMat.uniforms.top.value.copy(PAL.day.top).lerp(PAL.sunset.top, kk);
  skyMat.uniforms.bot.value.copy(PAL.day.bot).lerp(PAL.sunset.bot, kk);
  scene.fog.color.copy(skyMat.uniforms.bot.value);
  waterMat.color.copy(PAL.day.sea).lerp(PAL.sunset.sea, kk);
  clouds.forEach((c, i) => { c.position.x += dt * (1.4 + i * 0.2); if (c.position.x > 360) c.position.x = -360; });

  /* camera: chase cam behind the riders */
  [camX, camXV] = smoothDamp(camX, px, camXV, 0.3, dt);
  if (state === 'title'){
    const a = Math.sin(T * 0.28) * 0.7;
    tv.set(px + Math.sin(a) * 4.6, 1.7, -Math.cos(a) * 4.6); tl.set(px, 0.95, 0);
  } else if (state === 'over'){
    tv.set(px + 2.8, 3.6, 5.2); tl.set(px, 0.9, -1);
  } else if (camMode === 'near'){
    tv.set(camX * 0.86, 2.2 + py * 0.4, 4.1); tl.set(camX * 0.95, 1.05 + py * 0.3, -9);
  } else {
    tv.set(camX * 0.8, 3.6 + py * 0.3, 7.2); tl.set(camX * 0.9, 1.0 + py * 0.2, -10);
  }
  const follow = state === 'play' ? 7 : 3.2;
  camPos.lerp(tv, Math.min(1, dt * follow)); camLook.lerp(tl, Math.min(1, dt * follow));
  camera.position.copy(camPos);
  if (shake > 0){ camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 1.5); }
  camera.lookAt(camLook);
  const fovTarget = baseFov + (state === 'play' ? Math.min(14, (speed - 22) * 0.4) + (airborne ? 2 : 0) : 0);
  camera.fov += (fovTarget - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  if (state === 'play' && !reduceMotion){ camera.position.y += Math.sin(T * 31) * 0.012 * speed / 30; }
  if (state === 'play' || state === 'countdown') camera.rotateZ(bank * 0.18);
  sky.position.copy(camera.position); skyRig.position.set(camera.position.x, 0, camera.position.z);
  sunDisc.lookAt(camera.position);
  sunLight.target.position.set(px, 0, -10); sunLight.position.set(px + 7, 18, 6);

  /* HUD */
  if (state === 'play' || state === 'countdown'){
    const dd = Math.floor(dist); if (dd !== hudDist){ hudDist = dd; $('#dist').textContent = dd; }
    if (nuts !== hudNuts){ hudNuts = nuts; $('#nuts').textContent = nuts; }
    $('#shieldbar').hidden = shieldT <= 0; if (shieldT > 0) $('#shieldfill').style.width = (shieldT / 7 * 100) + '%';
  }
  if (state === 'title'){
    placeTag('#tagSq', tv.set(px - 0.4, py + 1.6, -0.2), -60, 0);
    placeTag('#tagDp', tv.set(px + 0.3, py + 0.05, -1.0), 80, 40);
  }
  renderer.render(scene, camera);
  renderLive();
}
const lcPos = new THREE.Vector3(), lcLook = new THREE.Vector3();
let liveSayTxt = '';
function renderLive(){
  if (liveEl.hidden) return;
  const r = liveEl.getBoundingClientRect(), c = canvas.getBoundingClientRect(); const bw = 4;
  const x = r.left - c.left + bw, y = r.top - c.top + bw, w = r.width - bw * 2, h = r.height - bw * 2;
  if (w < 10 || h < 10) return;
  const py = player.position.y;
  lcPos.set(px + 0.6 + Math.sin(T * 0.7) * 0.12, py + 0.95, -3.7); lcLook.set(px + 0.05, py + 0.62, -0.7);
  liveCam.position.lerp(lcPos, 0.5); liveCam.lookAt(lcLook); liveCam.aspect = w / h; liveCam.updateProjectionMatrix();
  renderer.shadowMap.autoUpdate = false;
  renderer.setScissorTest(true);
  renderer.setScissor(x, c.height - y - h, w, h); renderer.setViewport(x, c.height - y - h, w, h);
  renderer.render(scene, liveCam);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, c.width, c.height);
  renderer.shadowMap.autoUpdate = true;
}
function placeTag(id, v, ox, oy){
  v.project(camera); const el = $(id);
  const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
  el.style.transform = `translate(${x + ox}px, ${y + oy}px) translate(-50%,-100%)`;
}
drawHearts();
requestAnimationFrame(loop);
})();
</script>
